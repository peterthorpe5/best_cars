name: Python checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts app.py
      - run: python -m ruff format --check src tests scripts app.py
      - run: python -m pytest --cov=best_cars --cov-report=term-missing
      - run: python -m build
